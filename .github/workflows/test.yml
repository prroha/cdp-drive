name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: unit (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.4", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run test:unit

  smoke:
    name: smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux CI has no usable Chrome sandbox and the pages under test are
          # local files. The same flag on macOS leaves the renderer answering
          # nothing, so it stays empty there.
          - os: ubuntu-latest
            extra_flags: "--no-sandbox --disable-dev-shm-usage"
          - os: macos-latest
            extra_flags: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - name: Run the browser smoke test
        env:
          CDP_BROWSER: ${{ steps.chrome.outputs.chrome-path }}
          CDP_EXTRA_FLAGS: ${{ matrix.extra_flags }}
          # Fail fast when a command hangs, so a broken run reports in minutes.
          CDP_TIMEOUT_MS: "10000"
        run: npm run test:smoke

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck bin/cdp-launch.sh test/smoke.sh
