name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: unit (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.4", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run test:unit

  smoke:
    name: smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - name: Probe the DevTools endpoint
        env:
          CDP_BROWSER: ${{ steps.chrome.outputs.chrome-path }}
          CDP_EXTRA_FLAGS: "--no-sandbox --disable-dev-shm-usage"
        run: |
          "${CDP_BROWSER}" --version || true
          CDP_PORT=9455 CDP_PROFILE=/tmp/probe-profile CDP_HEADLESS=1 ./bin/cdp-launch.sh "file://$PWD/test/fixture.html"
          curl -s http://127.0.0.1:9455/json/version || true
          node test/ws-probe.mjs http://127.0.0.1:9455 fixture || true

      - name: Run the browser smoke test
        env:
          CDP_BROWSER: ${{ steps.chrome.outputs.chrome-path }}
          # CI has no usable Chrome sandbox; the pages under test are local files.
          CDP_EXTRA_FLAGS: "--no-sandbox --disable-dev-shm-usage"
        run: npm run test:smoke

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck bin/cdp-launch.sh test/smoke.sh
